# Environnement de développement : base de données et stockage des médias.
# L'application tourne sur ta machine avec `pnpm dev` et `pnpm worker:dev`.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: naatal
      POSTGRES_PASSWORD: naatal_dev
      POSTGRES_DB: naatal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naatal -d naatal"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Version figée : si l'image n'est plus disponible, prendre un autre service compatible S3.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: naatal
      MINIO_ROOT_PASSWORD: naatal_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      sh -c "sleep 3 &&
      mc alias set local http://minio:9000 naatal naatal_dev_secret &&
      mc mb --ignore-existing local/naatal-medias"

volumes:
  pgdata:
  miniodata:
